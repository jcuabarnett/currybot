<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CurryBot</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#241016">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CurryBot">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Shrikhand&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens ─────────────────────────────────────────────
       A curry house at night: flock-wallpaper maroon, turmeric, cream.
       Scores are coloured by spice heat, from raita to phaal. */
    :root {
      color-scheme: dark; /* native date picker, selects and scrollbars render dark */
      --bg:        #241016;
      --surface:   #331820;
      --surface-2: #42212A;
      --line:      #5A2E38;
      --text:      #FBEFDC;
      --text-2:    #DCC2AE;
      --text-3:    #B08E80;
      --turmeric:  #F4B63F;
      --turmeric-press: #DA9A22;
      --ink:       #2A1205;
      --chilli:    #EF5A44;

      --heat-0: #E9DCC4;  /* raita */
      --heat-1: #F6D365;  /* korma */
      --heat-2: #F4A93B;  /* medium */
      --heat-3: #EE7A35;  /* madras */
      --heat-4: #E4502F;  /* vindaloo */
      --heat-5: #C62828;  /* phaal */

      --display: 'Shrikhand', 'Figtree', serif;
      --body:    'Figtree', system-ui, -apple-system, sans-serif;

      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);

      --tab-h: 68px;
      --gutter: 16px;
      --r-sm: 10px;
      --r-md: 16px;
      --r-lg: 24px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; overscroll-behavior-y: none; }
    body {
      font-family: var(--body); font-size: 16px; line-height: 1.45;
      background: var(--bg); color: var(--text);
      padding-top: var(--sat);
      -webkit-font-smoothing: antialiased;
    }
    body.sheet-open { overflow: hidden; }
    img { display: block; max-width: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--turmeric); outline-offset: 2px; border-radius: 6px; }

    /* ── Header ───────────────────────────────────────────── */
    .header {
      position: sticky; top: 0; z-index: 200;
      display: flex; align-items: center; gap: 12px;
      height: 60px; padding: 0 calc(var(--gutter) + var(--sar)) 0 calc(var(--gutter) + var(--sal));
      background: rgba(36,16,22,.92);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .logo { font-family: var(--display); font-size: 26px; color: var(--turmeric); line-height: 1; letter-spacing: .2px; }
    .who {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
      min-height: 44px; padding: 4px 14px 4px 4px;
      border: 0; border-radius: 999px; background: var(--surface);
      font-weight: 600; font-size: 15px;
    }
    .who .av { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; }
    .who .admin-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--turmeric); }

    /* ── Layout ───────────────────────────────────────────── */
    .main {
      max-width: 640px; margin: 0 auto;
      padding: 8px calc(var(--gutter) + var(--sar)) calc(var(--tab-h) + var(--sab) + 28px) calc(var(--gutter) + var(--sal));
    }
    .view { display: none; }
    .view.active { display: block; }
    .page-title { font-family: var(--display); font-size: 30px; line-height: 1.1; margin: 12px 0 4px; }
    .page-sub { color: var(--text-2); font-size: 15px; margin-bottom: 18px; }
    .section-title { font-size: 19px; font-weight: 700; margin: 28px 0 12px; }

    /* ── Score badge (the one loud element) ──────────────── */
    .score {
      --size: 52px;
      width: var(--size); height: var(--size); flex-shrink: 0;
      border-radius: 50%; display: grid; place-items: center;
      font-family: var(--display); font-size: calc(var(--size) * .36); line-height: 1;
      color: var(--ink); background: var(--heat-2);
      padding-top: calc(var(--size) * .04);
    }
    .score.h0 { background: var(--heat-0); }
    .score.h1 { background: var(--heat-1); }
    .score.h2 { background: var(--heat-2); }
    .score.h3 { background: var(--heat-3); }
    .score.h4 { background: var(--heat-4); }
    .score.h5 { background: var(--heat-5); color: var(--text); }
    .score.none { background: transparent; border: 2px dashed var(--line); color: var(--text-3); font-family: var(--body); font-weight: 700; }
    .score.lg { --size: 76px; }
    .score.xl { --size: 92px; }
    .score.sm { --size: 40px; }

    /* ── Champion ─────────────────────────────────────────── */
    .champ {
      position: relative; display: block; width: 100%; text-align: left;
      border: 0; border-radius: var(--r-lg); overflow: hidden;
      background: var(--surface); margin: 8px 0 22px; color: var(--text);
      aspect-ratio: 4 / 3; max-height: 360px;
    }
    .champ img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .champ .no-photo {
      position: absolute; inset: 0; display: grid; place-items: center; font-size: 96px;
      background:
        radial-gradient(circle at 30% 20%, rgba(244,182,63,.28), transparent 55%),
        radial-gradient(circle at 80% 90%, rgba(239,90,68,.25), transparent 50%),
        var(--surface-2);
    }
    .champ .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(36,16,22,0) 35%, rgba(36,16,22,.94) 100%); }
    .champ .body { position: absolute; left: 18px; right: 18px; bottom: 16px; display: flex; align-items: flex-end; gap: 14px; }
    .champ .medal { font-size: 26px; line-height: 1; margin-bottom: 6px; }
    .champ .name { font-family: var(--display); font-size: 30px; line-height: 1.05; overflow-wrap: anywhere; }
    .champ .where { color: var(--text-2); font-size: 15px; margin-top: 4px; }
    .champ .grow { flex: 1; min-width: 0; }

    /* ── List rows ────────────────────────────────────────── */
    .rows { display: flex; flex-direction: column; gap: 4px; }
    .row {
      display: flex; align-items: center; gap: 14px; width: 100%;
      padding: 10px 8px 10px 4px; min-height: 76px;
      border: 0; border-radius: var(--r-md); background: transparent; text-align: left; color: var(--text);
    }
    .row:active { background: var(--surface); }
    .row .rank { width: 26px; text-align: center; font-weight: 700; color: var(--text-3); font-size: 15px; flex-shrink: 0; }
    .thumb {
      width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; overflow: hidden;
      background: var(--surface-2); display: grid; place-items: center; font-size: 28px;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .row .info { flex: 1; min-width: 0; }
    .row .name { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .sub { font-size: 14px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    /* ── Empty states ─────────────────────────────────────── */
    .empty { text-align: center; padding: 48px 12px; color: var(--text-2); }
    .empty .icon { font-size: 52px; margin-bottom: 12px; }
    .empty h3 { color: var(--text); font-size: 19px; margin-bottom: 6px; }
    .empty p { margin-bottom: 18px; }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 56px; padding: 0 24px; border: 0; border-radius: var(--r-md);
      background: var(--turmeric); color: var(--ink);
      font-size: 17px; font-weight: 800; touch-action: manipulation;
    }
    .btn:active { background: var(--turmeric-press); }
    .btn:disabled { opacity: .5; }
    .btn.block { width: 100%; }
    .btn.ghost { background: var(--surface); color: var(--text); font-weight: 700; }
    .btn.ghost:active { background: var(--surface-2); }
    .btn.danger { background: transparent; color: var(--chilli); box-shadow: inset 0 0 0 2px var(--chilli); }
    .btn.small { min-height: 44px; padding: 0 16px; font-size: 15px; border-radius: 12px; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 12px; border: 0;
      background: var(--surface-2); display: grid; place-items: center; font-size: 18px; flex-shrink: 0;
    }
    .link-btn { border: 0; background: none; color: var(--turmeric); font-weight: 700; min-height: 44px; padding: 0 4px; font-size: 16px; }

    /* ── Forms ────────────────────────────────────────────── */
    .field { margin-bottom: 18px; }
    .field > label, .field > .label { display: block; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .field .hint { font-size: 14px; color: var(--text-3); margin-top: 6px; }
    .field .err { display: none; font-size: 14px; color: var(--chilli); font-weight: 600; margin-top: 6px; }
    .field.invalid .err { display: block; }
    .field.invalid input, .field.invalid textarea, .field.invalid select { box-shadow: inset 0 0 0 2px var(--chilli); }
    input[type=text], input[type=date], input[type=password], select, textarea {
      width: 100%; min-height: 56px; padding: 14px 16px;
      background: var(--surface); border: 0; border-radius: var(--r-md);
      font-size: 17px; outline: none; -webkit-appearance: none; appearance: none;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    input:focus, select:focus, textarea:focus { box-shadow: inset 0 0 0 2px var(--turmeric); }
    select {
      background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
      background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%;
      background-size: 6px 6px; background-repeat: no-repeat; padding-right: 44px;
    }
    select option { background: var(--surface); }
    textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
    ::placeholder { color: var(--text-3); }

    .rating-as {
      display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 8px 8px 12px;
      background: var(--surface); border-radius: var(--r-md);
    }
    .rating-as .av { font-size: 26px; }
    .rating-as .nm { flex: 1; font-weight: 700; font-size: 17px; }

    /* Sliders */
    .metric { padding: 14px 0 6px; }
    .metric-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .metric-head .em { font-size: 28px; width: 36px; text-align: center; }
    .metric-head .lb { flex: 1; font-size: 18px; font-weight: 700; }
    .metric-head .val { font-family: var(--display); font-size: 28px; color: var(--turmeric); min-width: 56px; text-align: right; line-height: 1; }
    input[type=range] {
      --pct: 50%;
      -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; touch-action: pan-y;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 12px; border-radius: 999px;
      background: linear-gradient(90deg, var(--turmeric) var(--pct), var(--surface-2) var(--pct));
    }
    input[type=range]::-moz-range-track { height: 12px; border-radius: 999px; background: var(--surface-2); }
    input[type=range]::-moz-range-progress { height: 12px; border-radius: 999px; background: var(--turmeric); }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 36px; height: 36px; margin-top: -12px; border-radius: 50%;
      background: var(--text); border: 4px solid var(--turmeric); box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: var(--text); border: 4px solid var(--turmeric); }

    .rate-bar {
      position: sticky; bottom: calc(var(--tab-h) + var(--sab) + 10px); z-index: 50;
      display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 10px;
      background: rgba(51,24,32,.96); border-radius: var(--r-lg);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .rate-bar .btn { flex: 1; }
    .notice {
      display: flex; flex-direction: column; gap: 12px; padding: 16px; margin: 6px 0 18px;
      border-radius: var(--r-md); background: rgba(244,182,63,.12); box-shadow: inset 0 0 0 1px rgba(244,182,63,.4);
    }
    .notice p { font-weight: 600; }

    /* Photo picker */
    .photo-pick {
      position: relative; display: grid; place-items: center; gap: 6px; width: 100%; aspect-ratio: 16 / 9;
      border-radius: var(--r-md); overflow: hidden; border: 2px dashed var(--line); background: var(--surface);
      color: var(--text-2); font-weight: 700; text-align: center; cursor: pointer;
    }
    .photo-pick .cam { font-size: 34px; }
    .photo-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .photo-pick.has-photo { border-style: solid; border-color: transparent; }
    .photo-pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    /* ── Tab bar ──────────────────────────────────────────── */
    .tab-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
      height: calc(var(--tab-h) + var(--sab)); padding: 0 calc(8px + var(--sar)) var(--sab) calc(8px + var(--sal));
      display: flex; align-items: stretch;
      background: rgba(36,16,22,.96); box-shadow: 0 -1px 0 var(--line);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .tab {
      flex: 1; border: 0; background: none; color: var(--text-3);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font-size: 12px; font-weight: 700; -webkit-touch-callout: none; user-select: none;
    }
    .tab .ti { font-size: 25px; line-height: 1; filter: grayscale(1) opacity(.7); }
    .tab.active { color: var(--text); }
    .tab.active .ti { filter: none; }
    .tab.rate .ti {
      width: 56px; height: 56px; margin-top: -26px; border-radius: 50%;
      display: grid; place-items: center; font-size: 28px; filter: none;
      background: var(--turmeric); box-shadow: 0 6px 18px rgba(244,182,63,.35), 0 0 0 5px var(--bg);
    }
    .tab.rate { color: var(--text-2); }
    .tab.rate.active { color: var(--turmeric); }

    /* ── Bottom sheets ────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0; z-index: 500; display: flex; align-items: flex-end; justify-content: center;
      background: rgba(10,4,6,.7); opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: relative; width: 100%; max-width: 640px; max-height: 94vh; overflow-y: auto; overscroll-behavior: contain;
      background: var(--bg); border-radius: var(--r-lg) var(--r-lg) 0 0;
      padding: 0 calc(var(--gutter) + var(--sar)) calc(24px + var(--sab)) calc(var(--gutter) + var(--sal));
      transform: translateY(100%); transition: transform .28s cubic-bezier(.32,1,.56,1);
    }
    .overlay.open .sheet { transform: translateY(0); }
    .sheet-top { position: sticky; top: 0; z-index: 5; display: flex; justify-content: flex-end; padding: 10px 0 0; height: 0; }
    .sheet-top .icon-btn { background: rgba(36,16,22,.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .handle { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 10px auto 14px; }
    .sheet.compact { padding-top: 4px; }
    .sheet h2 { font-family: var(--display); font-size: 26px; margin-bottom: 14px; padding-right: 48px; }

    /* Detail */
    .d-photo { position: relative; margin: 0 calc(-1 * var(--gutter)); aspect-ratio: 16 / 10; max-height: 300px; background: var(--surface-2); }
    .d-photo img { width: 100%; height: 100%; object-fit: cover; }
    .d-photo .shade { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, var(--bg) 100%); }
    .d-photo .change { position: absolute; left: var(--gutter); top: 12px; }
    .d-head { display: flex; gap: 16px; align-items: center; margin: 16px 0 6px; }
    .d-head .grow { flex: 1; min-width: 0; }
    .d-name { font-family: var(--display); font-size: 30px; line-height: 1.08; overflow-wrap: anywhere; }
    .d-where { color: var(--text-2); font-size: 15px; margin-top: 4px; }
    .d-heat { font-weight: 700; margin-top: 4px; }
    .bars { display: flex; flex-direction: column; gap: 12px; }
    .bar-row { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; }
    .bar-row .em { font-size: 22px; text-align: center; }
    .bar-row .lb { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
    .bar-row .track { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
    .bar-row .fill { height: 100%; border-radius: 999px; background: var(--turmeric); }
    .bar-row .v { font-weight: 800; font-size: 17px; min-width: 36px; text-align: right; }
    details.verdict { margin-top: 18px; background: var(--surface); border-radius: var(--r-md); }
    details.verdict summary { list-style: none; min-height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; cursor: pointer; }
    details.verdict summary::-webkit-details-marker { display: none; }
    details.verdict summary::after { content: '+'; font-size: 22px; color: var(--turmeric); }
    details.verdict[open] summary::after { content: '–'; }
    details.verdict .in { padding: 0 16px 16px; color: var(--text-2); display: flex; flex-direction: column; gap: 10px; }

    .review { display: flex; gap: 12px; padding: 14px 0; box-shadow: 0 1px 0 var(--line); }
    .review:last-child { box-shadow: none; }
    .review .av { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
    .review .grow { flex: 1; min-width: 0; }
    .review .who-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .review .nm { font-weight: 700; }
    .review .when { font-size: 13px; color: var(--text-3); }
    .review .txt { margin-top: 4px; color: var(--text-2); overflow-wrap: anywhere; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font-size: 13px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--surface); color: var(--text-2); }
    .review .acts { display: flex; gap: 8px; margin-top: 10px; }

    .group-photo { border-radius: var(--r-md); overflow: hidden; }
    .group-photo img { width: 100%; max-height: 420px; object-fit: cover; }
    .group-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--text-3); font-size: 14px; }
    .sheet-cta { position: sticky; bottom: 0; padding: 14px 0 0; background: linear-gradient(180deg, transparent, var(--bg) 30%); margin-top: 20px; }

    /* Users */
    .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; margin-bottom: 22px; }
    .user-tile {
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; min-height: 96px;
      border: 0; border-radius: var(--r-md); background: var(--surface); font-weight: 700; font-size: 15px;
    }
    .user-tile .em { font-size: 32px; line-height: 1; }
    .user-tile.sel { box-shadow: inset 0 0 0 2px var(--turmeric); }
    .user-tile span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .join { display: flex; gap: 8px; }
    .join input { flex: 1; min-width: 0; }
    .join select { width: 76px; font-size: 22px; padding: 0 0 0 16px; background-image: none; }

    /* Profile */
    .me-head { display: flex; align-items: center; gap: 16px; margin: 12px 0 20px; }
    .me-av { width: 84px; height: 84px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 46px; flex-shrink: 0; }
    .me-title { color: var(--turmeric); font-weight: 700; font-size: 15px; }
    .me-name { font-family: var(--display); font-size: 30px; line-height: 1.1; overflow-wrap: anywhere; }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .tile { background: var(--surface); border-radius: var(--r-md); padding: 14px 10px; text-align: center; }
    .tile .n { font-family: var(--display); font-size: 26px; color: var(--turmeric); line-height: 1.1; }
    .tile .n.word { font-family: var(--body); font-weight: 800; font-size: 17px; color: var(--text); line-height: 1.6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tile .l { font-size: 13px; color: var(--text-3); margin-top: 2px; }
    .badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-3); }
    .badge .em { width: 56px; height: 56px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 26px; filter: grayscale(1) opacity(.45); }
    .badge.on { color: var(--text); }
    .badge.on .em { filter: none; background: rgba(244,182,63,.18); box-shadow: inset 0 0 0 2px var(--turmeric); }
    .admin-box { margin-top: 28px; padding: 16px; border-radius: var(--r-md); background: var(--surface); display: flex; align-items: center; gap: 12px; }
    .admin-box .grow { flex: 1; }
    .admin-box .t { font-weight: 700; }
    .admin-box .s { font-size: 14px; color: var(--text-3); }

    /* Import */
    details.import { margin-top: 32px; background: var(--surface); border-radius: var(--r-md); }
    details.import > summary { list-style: none; min-height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 17px; cursor: pointer; }
    details.import > summary::-webkit-details-marker { display: none; }
    details.import > summary::after { content: '+'; margin-left: auto; font-size: 24px; color: var(--turmeric); }
    details.import[open] > summary::after { content: '–'; }
    details.import .in { padding: 0 16px 16px; }
    details.import p { color: var(--text-2); font-size: 15px; margin-bottom: 12px; }
    .code { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--bg); color: var(--text-2); padding: 12px; border-radius: var(--r-sm); overflow-x: auto; white-space: pre; margin-bottom: 12px; }
    .report { margin-top: 14px; padding: 14px; border-radius: var(--r-sm); background: var(--bg); font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
    .report .bad { color: var(--chilli); }
    .report ul { padding-left: 18px; color: var(--text-2); }

    /* Install */
    .install { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; margin: 8px 0 4px; border-radius: var(--r-md); background: var(--surface); font-size: 15px; }
    .install .grow { flex: 1; color: var(--text-2); }
    .install strong { color: var(--text); display: block; }

    /* ── Toast ────────────────────────────────────────────── */
    .toast {
      position: fixed; left: 50%; z-index: 900;
      bottom: calc(var(--tab-h) + var(--sab) + 14px);
      width: min(440px, calc(100vw - 32px));
      display: flex; align-items: flex-start; gap: 10px;
      padding: 14px 16px; border-radius: var(--r-md);
      background: var(--text); color: var(--ink); font-weight: 600; font-size: 15px;
      box-shadow: 0 12px 32px rgba(0,0,0,.45);
      /* Hidden state is fully invisible regardless of message length. */
      opacity: 0; visibility: hidden; transform: translate(-50%, 16px);
      transition: opacity .2s, transform .25s, visibility 0s linear .25s;
    }
    .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity .2s, transform .25s, visibility 0s; }
    .toast.error { background: var(--chilli); color: #fff; }
    .toast .msg { flex: 1; }
    .toast .x { border: 0; background: none; font-size: 20px; line-height: 1; color: inherit; opacity: .7; min-width: 28px; min-height: 28px; margin: -4px -6px -4px 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
    }
    @media (min-width: 640px) {
      .overlay { align-items: center; }
      .sheet { border-radius: var(--r-lg); max-height: 88vh; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">CurryBot</div>
  <button class="who" id="who-btn" onclick="showUserSelector()" aria-label="Switch profile">
    <span class="av" id="who-emoji">👤</span>
    <span id="who-name">Who are you?</span>
    <span class="admin-dot" id="who-admin" hidden></span>
  </button>
</header>

<main class="main">

  <!-- Board -->
  <section id="view-board" class="view active" aria-label="Rankings">
    <div id="install-slot"></div>
    <div id="board"></div>
  </section>

  <!-- Rate -->
  <section id="view-rate" class="view" aria-label="Rate">
    <h1 class="page-title" id="rate-title">Rate a curry</h1>
    <p class="page-sub" id="rate-sub">Slide each score, then sum up the night.</p>

    <div class="field">
      <label for="rate-restaurant">Restaurant</label>
      <select id="rate-restaurant" onchange="onRateTargetChange()"></select>
    </div>
    <div class="field" id="rate-who-field"></div>
    <div class="field">
      <label for="rate-date">Date of visit</label>
      <input type="date" id="rate-date">
    </div>

    <div id="dup-notice"></div>

    <div id="rate-body">
      <div id="sliders"></div>

      <div class="field" id="summary-field" style="margin-top:14px">
        <label for="rate-summary">Summary</label>
        <textarea id="rate-summary" placeholder="Any memorable moments? Did someone order something deeply regrettable?"
                  oninput="document.getElementById('summary-field').classList.remove('invalid')"></textarea>
        <div class="err">Add a summary before submitting.</div>
      </div>

      <div class="rate-bar">
        <div class="score" id="preview-score">5.0</div>
        <button class="btn" id="rate-submit" onclick="submitRating()">Submit rating</button>
      </div>
      <div style="text-align:center;margin-top:10px">
        <button class="link-btn" id="rate-cancel" onclick="cancelEdit()" hidden>Cancel editing</button>
      </div>
    </div>
  </section>

  <!-- Add (admin) -->
  <section id="view-add" class="view" aria-label="Add a restaurant">
    <div id="add-content"></div>
  </section>

  <!-- Shame -->
  <section id="view-shame" class="view" aria-label="Hall of shame">
    <h1 class="page-title">Hall of shame</h1>
    <p class="page-sub">The five lowest scores. Never again.</p>
    <div id="shame-list"></div>
  </section>

  <!-- Me -->
  <section id="view-me" class="view" aria-label="Your profile">
    <div id="me-content"></div>
  </section>
</main>

<nav class="tab-bar" id="tab-bar" aria-label="Main"></nav>

<!-- Restaurant detail -->
<div class="overlay" id="detail-overlay" onclick="if(event.target===this)closeSheet('detail-overlay')">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Restaurant">
    <div class="sheet-top"><button class="icon-btn" onclick="closeSheet('detail-overlay')" aria-label="Close">✕</button></div>
    <div id="detail-content"></div>
  </div>
</div>

<!-- Profile picker -->
<div class="overlay" id="user-overlay" onclick="if(event.target===this)closeSheet('user-overlay')">
  <div class="sheet compact" role="dialog" aria-modal="true" aria-label="Choose your profile">
    <div class="handle"></div>
    <div class="sheet-top" style="top:-10px"><button class="icon-btn" onclick="closeSheet('user-overlay')" aria-label="Close">✕</button></div>
    <h2>Who are you?</h2>
    <div class="user-grid" id="user-grid"></div>
    <div class="field" style="margin-bottom:0">
      <label for="new-user-name">New to the crew?</label>
      <div class="join">
        <input type="text" id="new-user-name" placeholder="Your name" autocomplete="given-name"
               onkeydown="if(event.key==='Enter')createAndSelectUser()">
        <select id="new-user-emoji" aria-label="Pick an emoji">
          <option>🍛</option><option>🌶️</option><option>🧅</option><option>🥘</option>
          <option>🧄</option><option>🫚</option><option>🧆</option><option>🥙</option>
          <option>👑</option><option>🤴</option><option>💀</option><option>🔥</option>
          <option>😈</option><option>🧙</option><option>🤠</option><option>🥷</option>
        </select>
      </div>
      <button class="btn block" style="margin-top:10px" onclick="createAndSelectUser()">Join</button>
    </div>
  </div>
</div>

<!-- Admin PIN -->
<div class="overlay" id="pin-overlay" onclick="if(event.target===this)closeSheet('pin-overlay')">
  <div class="sheet compact" role="dialog" aria-modal="true" aria-label="Admin PIN">
    <div class="handle"></div>
    <h2>Admin PIN</h2>
    <p class="page-sub">Enter the PIN to add restaurants and manage ratings on this phone.</p>
    <div class="field" id="pin-field">
      <input type="password" id="pin-input" inputmode="numeric" autocomplete="off" placeholder="PIN"
             onkeydown="if(event.key==='Enter')submitPin()">
      <div class="err" id="pin-err">Wrong PIN</div>
    </div>
    <button class="btn block" onclick="submitPin()">Unlock admin</button>
    <div style="text-align:center;margin-top:8px"><button class="link-btn" onclick="closeSheet('pin-overlay')">Not now</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="msg" id="toast-msg"></span>
  <button class="x" onclick="hideToast()" aria-label="Dismiss">✕</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const state = {
  user: null, users: [], restaurants: [], stats: null,
  view: 'board', editing: null, rateTarget: null,
  config: { adminPinRequired: false },
  adminPin: lsGet('currybot_admin_pin') || '',
  adminVerified: false,
  pendingPhoto: null,
};

function lsGet(k)    { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function lsDel(k)    { try { localStorage.removeItem(k); } catch {} }

// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const METRICS = {
  poppadoms: { label: 'Poppadoms', emoji: '🫓' },
  main:      { label: 'Main',      emoji: '🍛' },
  price:     { label: 'Price',     emoji: '💷' },
  vibe:      { label: 'Vibe',      emoji: '✨' },
  service:   { label: 'Service',   emoji: '🤵' },
};
const KEYS = Object.keys(METRICS);
const APP_VERSION = 'v4';

const ACHIEVEMENTS = [
  { id:'first_bite',    emoji:'🍽️', name:'First bite' },
  { id:'curry_crawler', emoji:'🦀', name:'Curry crawler' },
  { id:'spice_pilgrim', emoji:'🛕', name:'Spice pilgrim' },
  { id:'naan_stop',     emoji:'🫓', name:'Naan-stop' },
  { id:'generous',      emoji:'🌟', name:'Generous soul' },
  { id:'critic',        emoji:'😤', name:'Harsh critic' },
  { id:'poppadom_10',   emoji:'👌', name:'Perfect poppadom' },
  { id:'all_tens',      emoji:'💯', name:'All tens' },
];

const COMMENTARY = {
  poppadoms: {
    low:  "These poppadoms stood accused of crimes against crunchiness. The verdict: guilty.",
    mid:  "The poppadoms performed their poppadom duties. Nothing more.",
    high: "Seriously good poppadoms. The table fell into respectful silence.",
    peak: "Transcendent. Someone nearly cried. Into the mango chutney.",
  },
  main: {
    low:  "The main course tasted like it was made by someone who once googled 'what is curry'.",
    mid:  "A main that existed. It had spices. Some may have been intentional.",
    high: "A proper main. Went back for seconds. No shame.",
    peak: "Genuinely transcendent. You rang your mum to tell her. She didn't care.",
  },
  price: {
    low:  "Robbery. With naan bread. The absolute cheek.",
    mid:  "You paid. You're not fully sure why.",
    high: "Excellent value. Left feeling smug and pleasantly full.",
    peak: "A bargain so obscene you tipped out of guilt.",
  },
  vibe: {
    low:  "The atmosphere: a waiting room, but spicier and with less hope.",
    mid:  "Passable vibes. The music was either too loud or entirely made up.",
    high: "Genuinely pleasant. You stayed longer than intended.",
    peak: "Immaculate vibes. Everyone looked cooler than usual. Even Gary.",
  },
  service: {
    low:  "Staff energy: someone on their fourth consecutive 12-hour shift.",
    mid:  "Service was technically present. Legally, that counts.",
    high: "Attentive without being hovery. The Goldilocks of service.",
    peak: "Service so good you're considering coming back just to thank them.",
  },
};
function commentary(metric, s) {
  const c = COMMENTARY[metric];
  return s < 4 ? c.low : s < 7 ? c.mid : s < 9.5 ? c.high : c.peak;
}

// Spice heat: drives the score badge colour and the label.
function heat(score) {
  if (score === null || score === undefined) return { cls: 'none', label: 'Not rated yet' };
  if (score < 3)   return { cls: 'h0', label: 'Raita level' };
  if (score < 5)   return { cls: 'h1', label: 'Korma level' };
  if (score < 6.5) return { cls: 'h2', label: 'Medium' };
  if (score < 7.5) return { cls: 'h3', label: 'Madras hot' };
  if (score < 8.5) return { cls: 'h4', label: 'Vindaloo vibes' };
  return { cls: 'h5', label: 'Phaal certified 🔥' };
}
function userTitle(n) {
  if (n === 0) return 'Curry novice'; if (n < 3) return 'Spice seeker'; if (n < 5) return 'Masala maven';
  if (n < 8) return 'Biryani baron'; if (n < 12) return 'Curry connoisseur'; return 'The Maharaja 👑';
}
const avg   = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const fmt   = n => (n === null || n === undefined) ? '–' : Number(n).toFixed(1);
const esc   = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const norm  = s => String(s || '').trim().toLowerCase();
const overallOf = rt => avg(KEYS.map(k => rt[k]));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

function scoreBadge(score, size = '') {
  const h = heat(score);
  return `<div class="score ${h.cls} ${size}" aria-label="Score ${fmt(score)} out of 10">${score === null || score === undefined ? '–' : fmt(score)}</div>`;
}
function thumb(r) {
  return `<div class="thumb">${r.photoUrl ? `<img src="${esc(r.photoUrl)}" alt="" loading="lazy">` : '🍛'}</div>`;
}
function userEmoji(name) {
  const u = state.users.find(u => norm(u.name) === norm(name));
  return u ? u.emoji : '🍛';
}
function prettyDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  return isNaN(d) ? iso : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

// ═══════════════════════════════════════════════════════════
// ADMIN
// ═══════════════════════════════════════════════════════════
function isAdmin() {
  return !!(state.user && state.user.isAdmin && (!state.config.adminPinRequired || state.adminVerified));
}

async function verifyStoredPin() {
  state.adminVerified = false;
  if (!state.user || !state.user.isAdmin || !state.config.adminPinRequired || !state.adminPin) return;
  try {
    await api('POST', '/admin/verify', { name: state.user.name, pin: state.adminPin });
    state.adminVerified = true;
  } catch { state.adminPin = ''; lsDel('currybot_admin_pin'); }
}

function openPin() {
  document.getElementById('pin-input').value = '';
  document.getElementById('pin-field').classList.remove('invalid');
  openSheet('pin-overlay');
  setTimeout(() => document.getElementById('pin-input').focus(), 250);
}

async function submitPin() {
  const pin = document.getElementById('pin-input').value.trim();
  if (!pin) return;
  try {
    await api('POST', '/admin/verify', { name: state.user.name, pin });
    state.adminPin = pin; state.adminVerified = true; lsSet('currybot_admin_pin', pin);
    closeSheet('pin-overlay');
    showToast('Admin unlocked');
    refreshChrome(); renderView(state.view);
  } catch (e) {
    document.getElementById('pin-err').textContent = e.message;
    document.getElementById('pin-field').classList.add('invalid');
  }
}

function lockAdmin() {
  state.adminPin = ''; state.adminVerified = false; lsDel('currybot_admin_pin');
  showToast('Admin locked on this phone');
  refreshChrome();
  if (state.view === 'add') navigate('board'); else renderView(state.view);
}

// ═══════════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════════
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.adminPin) headers['x-admin-pin'] = state.adminPin;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error(data.error || 'Something went wrong. Try again.');
    err.data = data; err.status = res.status;
    throw err;
  }
  return data;
}
async function loadAll() {
  const [restaurants, users, stats] = await Promise.all([api('GET','/restaurants'), api('GET','/users'), api('GET','/stats')]);
  state.restaurants = restaurants; state.users = users; state.stats = stats;
  // Keep the saved profile in sync (emoji/admin flag may have changed)
  if (state.user) {
    const fresh = users.find(u => u.id === state.user.id) || users.find(u => norm(u.name) === norm(state.user.name));
    if (fresh) { state.user = fresh; lsSet('currybot_user', JSON.stringify(fresh)); }
    else {
      // The saved profile no longer exists (e.g. after a data reset): ask them to pick again.
      state.user = null; state.adminVerified = false; lsDel('currybot_user');
      refreshChrome();
    }
  }
}

// ═══════════════════════════════════════════════════════════
// NAVIGATION & CHROME
// ═══════════════════════════════════════════════════════════
function renderTabs() {
  const tabs = [
    ['board', '🏆', 'Board'],
    ['shame', '💩', 'Shame'],
    ['rate',  '🌶️', 'Rate'],
    ...(isAdmin() ? [['add', '➕', 'Add']] : []),
    ['me',    '👤', 'Me'],
  ];
  document.getElementById('tab-bar').innerHTML = tabs.map(([v, i, l]) =>
    `<button class="tab ${v === 'rate' ? 'rate' : ''} ${state.view === v ? 'active' : ''}" data-view="${v}" onclick="navigate('${v}')" ${state.view === v ? 'aria-current="page"' : ''}>
       <span class="ti" aria-hidden="true">${i}</span><span>${l}</span>
     </button>`).join('');
}
function refreshChrome() {
  document.getElementById('who-emoji').textContent = state.user ? state.user.emoji : '👤';
  document.getElementById('who-name').textContent  = state.user ? state.user.name : 'Who are you?';
  document.getElementById('who-admin').hidden = !isAdmin();
  renderTabs();
}
function navigate(view, opts = {}) {
  if (view === 'add' && !isAdmin()) view = 'board';
  if (view !== 'rate') state.editing = null;
  state.rateTarget = opts.restaurantId || null;
  state.view = view;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  renderTabs();
  window.scrollTo(0, 0);
  renderView(view);
}
function renderView(v) {
  ({ board: renderBoard, rate: renderRate, add: renderAdd, shame: renderShame, me: renderMe }[v] || (() => {}))();
}

// ═══════════════════════════════════════════════════════════
// BOARD
// ═══════════════════════════════════════════════════════════
function row(r, rank) {
  const sub = r.ratingCount ? (r.location ? esc(r.location) : plural(r.ratingCount, 'rating')) : (r.location ? esc(r.location) + ', not rated yet' : 'Not rated yet');
  return `
    <button class="row" onclick="showDetail(${r.id})">
      ${rank !== null && rank !== undefined ? `<div class="rank">${rank}</div>` : ''}
      ${thumb(r)}
      <div class="info"><div class="name">${esc(r.name)}</div><div class="sub">${sub}</div></div>
      ${scoreBadge(r.overallScore)}
    </button>`;
}

function renderBoard() {
  const el = document.getElementById('board');
  if (!state.restaurants.length) {
    el.innerHTML = `<div class="empty"><div class="icon">🍛</div><h3>No curry houses yet</h3>
      <p>${isAdmin() ? 'Add the first one to get the board going.' : 'The admin adds restaurants. Once one is on, you can rate it.'}</p>
      ${isAdmin() ? `<button class="btn" onclick="navigate('add')">Add a restaurant</button>` : ''}</div>`;
    return;
  }
  const rated = state.restaurants.filter(r => r.overallScore !== null);
  const rest  = state.restaurants;
  let html = '';
  if (rated.length) {
    const top = rated[0];
    html += `
      <button class="champ" onclick="showDetail(${top.id})" aria-label="Top of the board: ${esc(top.name)}">
        ${top.photoUrl ? `<img src="${esc(top.photoUrl)}" alt="">` : `<div class="no-photo">🍛</div>`}
        <div class="shade"></div>
        <div class="body">
          <div class="grow">
            <div class="medal" aria-hidden="true">🥇</div>
            <div class="name">${esc(top.name)}</div>
            <div class="where">${top.location ? esc(top.location) + ', ' : ''}${plural(top.ratingCount, 'rating')}</div>
          </div>
          ${scoreBadge(top.overallScore, 'xl')}
        </div>
      </button>`;
  }
  const list = rated.length ? rest.slice(1) : rest;
  if (list.length) {
    // Unrated places get an empty rank cell so they line up with the ranked rows.
    html += `<div class="rows">${list.map((r, i) => row(r, r.overallScore !== null ? i + (rated.length ? 2 : 1) : '')).join('')}</div>`;
  }
  el.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════
// SHAME
// ═══════════════════════════════════════════════════════════
function renderShame() {
  const worst = state.restaurants.filter(r => r.overallScore !== null)
    .sort((a, b) => a.overallScore - b.overallScore).slice(0, 5);
  const el = document.getElementById('shame-list');
  el.innerHTML = worst.length
    ? `<div class="rows">${worst.map(r => row(r, null)).join('')}</div>`
    : `<div class="empty"><div class="icon">🎉</div><h3>Nothing shameful yet</h3><p>Rated restaurants show up here, lowest first.</p></div>`;
}

// ═══════════════════════════════════════════════════════════
// DETAIL SHEET
// ═══════════════════════════════════════════════════════════
function findRating(id) {
  for (const r of state.restaurants) {
    const rt = (r.ratings || []).find(x => x.id === id);
    if (rt) return { rating: rt, restaurant: r };
  }
  return {};
}

function showDetail(id) {
  const r = state.restaurants.find(x => x.id === id); if (!r) return;
  const h = heat(r.overallScore);
  const mine = state.user && (r.ratings || []).find(rt => norm(rt.userName) === norm(state.user.name));

  const photo = r.photoUrl
    ? `<div class="d-photo"><img src="${esc(r.photoUrl)}" alt="${esc(r.name)}"><div class="shade"></div>
         ${isAdmin() ? `<label class="btn small ghost change">Change photo<input type="file" accept="image/*" hidden onchange="uploadPhoto(${r.id},'profile',this)"></label>` : ''}
       </div>`
    : (isAdmin() ? `<div style="height:56px"></div><label class="photo-pick" style="aspect-ratio:auto;min-height:120px">
         <span class="cam">📷</span><span>Add restaurant photo</span>
         <input type="file" accept="image/*" onchange="uploadPhoto(${r.id},'profile',this)"></label>` : `<div style="height:56px"></div>`);

  const breakdown = r.avgScores ? `
    <h3 class="section-title">Breakdown</h3>

function compressImage(file, maxDim = 1000, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('That file could not be read as an image'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadPhoto(restaurantId, type, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!state.user) { input.value = ''; showToast('Pick your profile first', true); return showUserSelector(); }
  try {
    showToast('Uploading photo…');
    const image = await compressImage(file);
    await api('PATCH', `/restaurants/${restaurantId}/photo`, { type, image, requestingUser: state.user.name });
    await loadAll();
    showToast(type === 'group' ? 'Group photo added' : 'Restaurant photo updated');
    showDetail(restaurantId);
    renderView(state.view);
  } catch (e) { showToast(e.message, true); }
  finally { input.value = ''; }
}

// Show a notice instead of letting someone submit a duplicate rating.
function onRateTargetChange() {
  const notice = document.getElementById('dup-notice');
  const body   = document.getElementById('rate-body');
  if (state.editing) { notice.innerHTML = ''; body.hidden = false; return; }
  const rid = Number(document.getElementById('rate-restaurant').value);
  const who = raterName();
  const r = state.restaurants.find(x => x.id === rid);
  const existing = r && who && (r.ratings || []).find(rt => norm(rt.userName) === norm(who));
  if (existing) {
    const you = state.user && norm(who) === norm(state.user.name);
    notice.innerHTML = `<div class="notice">
        <p>${you ? "You've" : esc(existing.userName) + ' has'} already rated ${esc(r.name)}.</p>
        <button class="btn small" onclick="editRating(${existing.id})">Edit ${you ? 'your' : 'that'} rating</button>
      </div>`;
    body.hidden = true;
  } else {
    notice.innerHTML = '';
    body.hidden = false;
  }
}

async function submitRating() {
  const restaurantId = Number(document.getElementById('rate-restaurant').value);
  const userName     = state.editing ? state.editing.userName : raterName();
  const visitDate    = document.getElementById('rate-date').value;
  const summary      = document.getElementById('rate-summary').value.trim();

  if (!state.user)   { showToast('Pick your profile first', true); return showUserSelector(); }
  if (!restaurantId) return showToast('Choose a restaurant', true);
  if (!summary) {
    document.getElementById('summary-field').classList.add('invalid');
    document.getElementById('rate-summary').focus();
    return;
  }
  const scores = {};
  KEYS.forEach(k => { scores[k] = parseFloat(document.getElementById('slider-' + k).value); });

  const btn = document.getElementById('rate-submit');
  btn.disabled = true;
  try {
    if (state.editing) {
      await api('PUT', `/ratings/${state.editing.id}`, { requestingUser: state.user.name, ...scores, summary, visitDate });
      const rid = state.editing.restaurantId;
      state.editing = null;
      await loadAll();
      showToast('Changes saved');
      navigate('board');
      showDetail(rid);
      return;
    }
    await api('POST', '/ratings', { restaurantId, userName, requestingUser: state.user.name, ...scores, summary, visitDate });
    await loadAll();
    const o = avg(Object.values(scores));
    showToast(o >= 8.5 ? 'Rating submitted. What a place.' : o >= 6.5 ? 'Rating submitted. The naan gods are pleased.'
            : o >= 5 ? 'Rating submitted. Could be worse.' : "Rating submitted. That's why we log these things.");
    navigate('board');
  } catch (e) {
    showToast(e.message, true);
    if (e.data && e.data.existingRatingId) { await loadAll().catch(() => {}); onRateTargetChange(); }
  } finally { btn.disabled = false; }
}

  const { rating, restaurant } = findRating(id);
  if (!rating) return;
  state.editing = { id, restaurantId: restaurant.id, userName: rating.userName };
  closeSheet('detail-overlay');
  state.view = 'rate';
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-rate'));
  renderTabs();

  const rid = state.editing && state.editing.restaurantId;

  if (!confirm('Delete this rating? This cannot be undone.')) return;

    await api('DELETE', `/ratings/${id}`, { requestingUser: state.user.name });

// CSV / tab-separated parser that handles quoted fields with commas and line breaks.
function parseTable(text) {
  text = text.replace(/\r\n?/g, '\n').trim();
  if (!text) return [];
  const delim = text.split('\n')[0].includes('\t') ? '\t' : ',';
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"' && field === '') q = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else field += c;
  }
  row.push(field); rows.push(row);
  return rows.filter(r => r.some(f => f.trim() !== ''));
}

const IMPORT_COLS = {
  restaurant: ['restaurant', 'restaurant name', 'name'],
  location:   ['location', 'town', 'area', 'where'],
  date:       ['date', 'visit date', 'visited'],
  person:     ['person', 'who', 'user', 'rater', 'username'],
  poppadoms:  ['poppadoms', 'poppadom', 'pops'],
  main:       ['main', 'mains', 'curry'],
  price:      ['price', 'value'],
  vibe:       ['vibe', 'vibes', 'atmosphere'],
  service:    ['service'],
  summary:    ['summary', 'notes', 'comment', 'comments'],
};

// Accept YYYY-MM-DD or UK DD/MM/YYYY.
function normDate(s) {
  s = String(s || '').trim();
  if (!s) return '';
  const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return s;
}

function tableToRows(text) {
  const table = parseTable(text);
  if (table.length < 2) throw new Error('Paste the header row and at least one data row');
  const header = table[0].map(h => norm(h));
  const idx = {};
  for (const [key, names] of Object.entries(IMPORT_COLS)) idx[key] = header.findIndex(h => names.includes(h));
  const missing = ['restaurant', 'person', ...KEYS].filter(k => idx[k] === -1);
  if (missing.length) throw new Error('Missing column' + (missing.length > 1 ? 's' : '') + ': ' + missing.join(', '));
  return table.slice(1).map(cells => {
    const get = k => idx[k] === -1 ? '' : (cells[idx[k]] ?? '').trim();
    const o = { restaurant: get('restaurant'), location: get('location'), date: normDate(get('date')), person: get('person'), summary: get('summary') };
    KEYS.forEach(k => { o[k] = get(k); });
    return o;
  });
}

async function runImport(dryRun) {
  const out = document.getElementById('import-report');
  let rows;
  try { rows = tableToRows(document.getElementById('import-text').value); }
  catch (e) { out.innerHTML = `<div class="report"><span class="bad">${esc(e.message)}</span></div>`; return; }
  try {
    const rep = await api('POST', '/admin/import', { rows, dryRun, requestingUser: state.user.name });
    const lines = [
      `<strong>${dryRun ? 'Ready to import' : 'Imported'} ${plural(rep.ratingsCreated, 'rating')}</strong>`,
      rep.restaurantsCreated.length ? `<span>New restaurants: ${rep.restaurantsCreated.map(esc).join(', ')}</span>` : '',
      rep.usersCreated.length ? `<span>New people: ${rep.usersCreated.map(esc).join(', ')}</span>` : '',
      rep.skipped.length ? `<span>Skipped ${rep.skipped.length}:</span><ul>${rep.skipped.map(s => `<li>${esc(s)}</li>`).join('')}</ul>` : '',
    ].filter(Boolean).join('');
    out.innerHTML = `<div class="report">${lines}</div>` +
      (dryRun && rep.ratingsCreated ? `<button class="btn block" style="margin-top:12px" onclick="runImport(false)">Import ${plural(rep.ratingsCreated, 'rating')}</button>` : '');
    if (!dryRun) {
      await loadAll();
      document.getElementById('import-text').value = '';
      showToast(`Imported ${plural(rep.ratingsCreated, 'rating')}`);
    }
  } catch (e) {
    const errs = e.data && e.data.errors;
    out.innerHTML = `<div class="report"><span class="bad">${esc(e.message)}</span>${errs ? `<ul>${errs.slice(0, 30).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;
  }
}

function earnedBadges(r) {
  const e = [];
  if (r.length >= 1) e.push('first_bite');
  if (r.length >= 3) e.push('curry_crawler');
  if (r.length >= 5) e.push('spice_pilgrim');
  if (r.length >= 10) e.push('naan_stop');
  if (r.some(rt => rt.poppadoms === 10)) e.push('poppadom_10');
  if (r.some(rt => KEYS.every(k => rt[k] === 10))) e.push('all_tens');
  if (r.length) { const a = avg(r.map(overallOf)); if (a >= 8) e.push('generous'); if (a < 4) e.push('critic'); }
  return e;
}

function renderMeBody() {
  const el = document.getElementById('me-content');
  if (!state.user) {
    el.innerHTML = `<div class="empty"><div class="icon">👤</div><h3>Who are you?</h3><p>Pick your profile to see your ratings and badges.</p>
      <button class="btn" onclick="showUserSelector()">Pick your profile</button></div>`;
    return;
  }
  const u = state.user;
  const mine = state.restaurants.flatMap(r => (r.ratings || []).filter(rt => norm(rt.userName) === norm(u.name)).map(rt => ({ ...rt, r })));
  const avgGiven = mine.length ? avg(mine.map(overallOf)) : null;
  const earned = earnedBadges(mine);
  const s = state.stats;

  el.innerHTML = `
    <div class="me-head">
      <div class="me-av">${u.emoji}</div>
      <div><div class="me-title">${userTitle(mine.length)}</div><div class="me-name">${esc(u.name)}</div></div>
    </div>
    <div class="tiles">
      <div class="tile"><div class="n">${mine.length}</div><div class="l">Ratings</div></div>
      <div class="tile"><div class="n">${avgGiven === null ? '–' : fmt(avgGiven)}</div><div class="l">Average given</div></div>
      <div class="tile"><div class="n">${earned.length}</div><div class="l">Badges</div></div>
    </div>

    <h3 class="section-title">Badges</h3>
    <div class="badges">${ACHIEVEMENTS.map(a => `<div class="badge ${earned.includes(a.id) ? 'on' : ''}"><div class="em">${a.emoji}</div>${a.name}</div>`).join('')}</div>

    <h3 class="section-title">Your ratings</h3>
    ${mine.length
      ? `<div class="rows">${mine.sort((a, b) => overallOf(b) - overallOf(a)).map(rt => `
          <button class="row" onclick="showDetail(${rt.r.id})">
            ${thumb(rt.r)}
            <div class="info"><div class="name">${esc(rt.r.name)}</div><div class="sub">${prettyDate(rt.visitDate) || esc(rt.r.location || '')}</div></div>
            ${scoreBadge(overallOf(rt))}
          </button>`).join('')}</div>`
      : `<div class="empty" style="padding:24px 0"><p>No ratings yet.</p><button class="btn" onclick="navigate('rate')">Rate a curry</button></div>`}

    ${s ? `<h3 class="section-title">The crew</h3>
      <div class="tiles">
        <div class="tile"><div class="n">${s.totalRestaurants}</div><div class="l">Restaurants</div></div>
        <div class="tile"><div class="n">${s.totalRatings}</div><div class="l">Ratings</div></div>
        <div class="tile"><div class="n">${s.totalUsers}</div><div class="l">People</div></div>
      </div>
      ${s.topRater || s.mostControversial ? `<div class="tiles" style="grid-template-columns:1fr 1fr;margin-top:10px">
        ${s.topRater ? `<div class="tile"><div class="n word">${esc(s.topRater.name)}</div><div class="l">Most ratings (${s.topRater.count})</div></div>` : ''}
        ${s.mostControversial ? `<div class="tile"><div class="n word">${esc(s.mostControversial.name)}</div><div class="l">Most argued over</div></div>` : ''}
      </div>` : ''}` : ''}

    ${u.isAdmin ? `<div class="admin-box">
        <div class="grow"><div class="t">${isAdmin() ? 'Admin unlocked' : 'Admin locked'}</div>
          <div class="s">${isAdmin() ? 'You can add restaurants and manage any rating.' : 'Unlock to add restaurants on this phone.'}</div></div>
        ${state.config.adminPinRequired ? (isAdmin()
          ? `<button class="btn small ghost" onclick="lockAdmin()">Lock</button>`
          : `<button class="btn small" onclick="openPin()">Unlock</button>`) : ''}
      </div>` : ''}`;
}

// ═══════════════════════════════════════════════════════════
// PROFILE PICKER
// ═══════════════════════════════════════════════════════════
function showUserSelector() {
  const grid = document.getElementById('user-grid');
  grid.innerHTML = state.users.length
    ? state.users.map(u => `<button class="user-tile ${state.user && state.user.id === u.id ? 'sel' : ''}" onclick="selectUser(${u.id})">
        <span class="em">${u.emoji}</span><span>${esc(u.name)}</span></button>`).join('')
    : `<p style="color:var(--text-2);grid-column:1/-1">No one here yet. Join below.</p>`;
  openSheet('user-overlay');
}

async function setUser(user) {
  const changed = !state.user || norm(state.user.name) !== norm(user.name);
  state.user = user;
  lsSet('currybot_user', JSON.stringify(user));
  if (changed) { state.adminVerified = false; await verifyStoredPin(); }
  closeSheet('user-overlay');
  refreshChrome();
  if (state.view === 'add' && !isAdmin()) navigate('board'); else renderView(state.view);
  if (user.isAdmin && !isAdmin() && state.config.adminPinRequired) openPin();
}

function selectUser(id) {
  const u = state.users.find(x => x.id === id);
  if (u) setUser(u);
}

async function createAndSelectUser() {
  const name = document.getElementById('new-user-name').value.trim();
  const emoji = document.getElementById('new-user-emoji').value;
  if (!name) return showToast('Enter your name', true);
  try {
    const user = await api('POST', '/users', { name, emoji });
    await loadAll();
    document.getElementById('new-user-name').value = '';
    await setUser(user);
    showToast(`Welcome to the crew, ${name}`);
  } catch (e) { showToast(e.message, true); }
}

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg, isError = false) {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.classList.toggle('error', isError);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, isError ? 6000 : 3500);
}
function hideToast() {
  clearTimeout(toastTimer);
  document.getElementById('toast').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════
// INSTALL PROMPTS
// ═══════════════════════════════════════════════════════════
let deferredInstall = null;
function setupInstall() {
  const slot = document.getElementById('install-slot');
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredInstall = e;
    slot.innerHTML = `<div class="install"><span style="font-size:28px">📲</span>
      <div class="grow"><strong>Install CurryBot</strong>Open it from your home screen.</div>
      <button class="btn small" onclick="doInstall()">Install</button></div>`;
  });
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios && !window.navigator.standalone && !lsGet('ios-banner-dismissed')) {
    slot.innerHTML = `<div class="install"><span style="font-size:28px">📱</span>
      <div class="grow"><strong>Add to Home Screen</strong>Tap Share, then Add to Home Screen.</div>
      <button class="icon-btn" onclick="lsSet('ios-banner-dismissed','1');this.closest('.install').remove()" aria-label="Dismiss">✕</button></div>`;
  }
}
function doInstall() {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(() => { deferredInstall = null; document.getElementById('install-slot').innerHTML = ''; });
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init() {
  // Always check for a new version: on open, and whenever the app comes back to the foreground
  // (home-screen apps on iPhone resume without reloading).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(err => console.warn('SW:', err));
  }
  setupInstall();

  try { const saved = lsGet('currybot_user'); if (saved) state.user = JSON.parse(saved); } catch {}
  refreshChrome();

  try {
    state.config = await api('GET', '/config');
    await loadAll();
    await verifyStoredPin();
    refreshChrome();
    renderView(state.view);
    if (!state.user) showUserSelector();
    // Refresh the board in the background, but never re-render a form someone is filling in.
    setInterval(async () => {
      try { await loadAll(); if (state.view === 'board' || state.view === 'shame') renderView(state.view); } catch {}
    }, 30000);
  } catch (e) {
    showToast("Can't reach CurryBot. Check your connection and reopen the app.", true);
  }
}

init();
</script>
